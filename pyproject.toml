[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ak_rust"
version = "0.1.1"
description = "A-share market analysis toolkit: tick chart, transaction analysis, breakout detection, auction scanning"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "ak_team"}]
# pandas 为信号调度层运行时必需（Rust 侧构建/合并 DataFrame），故设为硬依赖
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
# czsc 为可选依赖：仅当 signals_config 含非 ak 信号时才导入，纯 ak 信号路径不依赖
czsc = ["czsc>=1.0.0rc8"]

[tool.maturin]
module-name = "ak_rust._native"
features = ["pyo3/extension-module"]
manifest-path = "crates/ak-python/Cargo.toml"
